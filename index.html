<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.E.G.E.N — Don’t Exit, Gains Every Night</title>

<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#05060b;
  color:#fff;
  font-family:'Black Ops One',cursive;
  overflow-x:hidden;
}

/* ===== CANDLE BACKGROUND ===== */
.bg-holder{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
}

.candle{
  position:absolute;
  bottom:-60px;
  width:6px;
  border-radius:3px;
  background:#00ff88;
  box-shadow:0 0 8px #00ff88;
  animation:rise linear infinite;
  opacity:0.8;
}

.wick{
  position:absolute;
  top:-6px;
  left:50%;
  width:2px;
  height:6px;
  background:#caffea;
  transform:translateX(-50%);
}

@keyframes rise{
  from{
    transform:translateY(0);
    opacity:0.2;
  }
  to{
    transform:translateY(-130vh);
    opacity:1;
  }
}

/* ===== CONTENT ===== */
.container{
  max-width:1200px;
  margin:auto;
  padding:30px;
  text-align:center;
}

.hero img{
  width:100%;
  max-width:950px;
  border-radius:25px;
  box-shadow:0 0 45px #00ff88;
}

h1{
  font-size:3.2rem;
  color:#00ff88;
  text-shadow:0 0 25px #00ff88;
  margin:20px 0 5px;
}

.tagline{color:#ccc;font-size:1.2rem;}
.subline{color:#8affc7;font-size:0.9rem;}

.contract-box{
  margin:25px auto;
  max-width:520px;
  padding:12px;
  border:1px solid #00ff88;
  border-radius:12px;
  background:rgba(255,255,255,0.06);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  font-size:0.8rem;
  word-break:break-all;
}

.copy-btn{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#00ff88;
  color:#000;
  font-weight:bold;
}

.buy-btn{
  margin:30px auto;
  padding:16px 45px;
  font-size:1.5rem;
  border:none;
  border-radius:16px;
  cursor:pointer;
  color:#000;
  background:linear-gradient(120deg,#00ff88,#ffffff,#00ff88);
  background-size:200% 200%;
  animation:shine 2s linear infinite;
}

@keyframes shine{
  0%{background-position:0%}
  100%{background-position:200%}
}

.chart-box{
  margin:45px auto;
  max-width:1050px;
  border:2px solid #00ff88;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 0 35px rgba(0,255,136,0.35);
}

iframe{
  width:100%;
  height:540px;
  border:none;
}

.section{margin:60px 0;}
.section h2{color:#00ff88;margin-bottom:15px;}
ul{list-style:none;padding:0;}
ul li{margin:9px 0;color:#ccc;}

.footer{
  margin:60px 0 20px;
  color:#777;
  font-size:0.85rem;
}
</style>
</head>

<body>

<!-- CANDLE BG -->
<div class="bg-holder" id="bg"></div>

<div class="container">

  <div class="hero">
    <img src="https://i.imgur.com/YOUR_DEGEN_IMAGE.jpg">
  </div>

  <h1>D.E.G.E.N</h1>
  <div class="tagline">Don’t Exit. Gains Every Night.</div>
  <div class="subline">Built for Night Traders • No Panic • No Exit</div>

  <div class="contract-box">
    <span id="contract">4A2gZAuwfWTxDxKazHVVPK125gQMcRc6k4pN7zy8pump</span>
    <button class="copy-btn" onclick="copyContract()">COPY</button>
  </div>

  <button class="buy-btn">BUY NOW</button>

  <div class="chart-box">
    <iframe src="https://dexscreener.com/solana/PASTE_CONTRACT_ADDRESS_HERE?embed=1&theme=dark"></iframe>
  </div>

  <div class="section">
    <h2>DEGEN RULES</h2>
    <ul>
      <li>No Exit</li>
      <li>No Panic</li>
      <li>Trust the Candle</li>
      <li>Sleep Is Optional</li>
    </ul>
  </div>

  <div class="footer">Built for Degens • Night Never Ends</div>

</div>

<script>
/* CREATE CANDLES */
const bg=document.getElementById("bg");
const candleCount=160;

for(let i=0;i<candleCount;i++){
  const c=document.createElement("div");
  c.className="candle";
  c.style.left=Math.random()*100+"vw";
  c.style.height=(12+Math.random()*22)+"px";
  c.style.animationDuration=(6+Math.random()*10)+"s";
  c.style.animationDelay=Math.random()*10+"s";

  const wick=document.createElement("div");
  wick.className="wick";
  c.appendChild(wick);

  bg.appendChild(c);
}

/* COPY */
function copyContract(){
 navigator.clipboard.writeText(
  document.getElementById("contract").innerText
 );
 alert("Contract Copied");
}
</script>
<script>
const pairAddress = document.getElementById("contract").innerText.trim();

/* BUY NOW → Dexscreener */
document.getElementById("buyBtn").onclick = () => {
  window.open(
    `https://dexscreener.com/solana/${pairAddress}`,
    "_blank"
  );
};

/* IFRAME AUTO LOAD */
document.getElementById("dexChart").src =
  `https://dexscreener.com/solana/${pairAddress}?embed=1&theme=dark&trades=0&info=0`;

/* COPY */
function copyContract(){
  navigator.clipboard.writeText(pairAddress);
  alert("Contract Copied");
}
</script>
</body>
  </html>
